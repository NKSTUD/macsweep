[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macsweep"
version = "1.0.0"
description = "Free up space on your Mac from a clean local app, or let any AI assistant do it safely through MCP."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["macos", "cleaner", "disk-space", "mcp", "model-context-protocol", "ai-tools"]
classifiers = [
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/NKSTUD/macsweep"

[project.scripts]
macsweep = "macsweep.app:main"
macsweep-mcp = "macsweep.mcp_server:main"

[tool.setuptools]
packages = ["macsweep"]

[tool.setuptools.package-data]
macsweep = ["ui.html"]
